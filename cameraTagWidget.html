<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Camera + Tagging Widget</title>
    <style>
      #camera-container {
        position: relative;
        width: 320px;
        height: 240px;
        border: 1px solid #ccc;
        margin-bottom: 8px;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #tag-menu {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 4px;
        border-radius: 4px;
        display: none;
      }
      #capture-btn,
      #tag-btn {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div id="camera-container">
      <video id="video" autoplay playsinline></video>
      <div id="tag-menu">
        <label><input type="checkbox" value="301" class="tag-checkbox" /> 301</label><br />
        <label><input type="checkbox" value="601" class="tag-checkbox" /> 601</label><br />
        <label><input type="checkbox" value="719" class="tag-checkbox" /> 719</label><br />
      </div>
    </div>

    <button id="tag-btn">Tags</button>
    <button id="capture-btn">Capture</button>

    <script>
      const video = document.getElementById('video');

      // Try rear camera first, fallback to any available
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: "environment" } },
        audio: false
      })
      .then((stream) => {
        video.srcObject = stream;
      })
      .catch((err) => {
        console.warn("Rear camera not found. Falling back to default camera.", err);
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then((stream) => {
            video.srcObject = stream;
          })
          .catch((error) => {
            console.error("Camera access error:", error);
          });
      });

      const tagMenu = document.getElementById('tag-menu');
      document.getElementById('tag-btn').addEventListener('click', () => {
        tagMenu.style.display = tagMenu.style.display === 'none' ? 'block' : 'none';
      });
